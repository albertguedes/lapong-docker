#
# default.conf - nginx default configuration for Lapong
#
# Ports:
#   8080 - Main API gateway
#   8000 - PHP App (standalone)
#   8001 - Laravel
#   8002 - Lumen API
#
# Routes:
#   /         → index.html (dashboard)
#   /health   → health check
#   /app/*    → PHP App
#   /laravel/* → Laravel app
#   /lumen/*  → Lumen API
#
# Upstream: PHP-FPM on 127.0.0.1:9000
#
upstream php-fpm {
    server 127.0.0.1:9000;
}

# Port 8000 - PHP App (standalone)
server {
    listen 8000;
    server_name localhost;
    root /var/www/html/app/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# Port 8001 - Laravel
server {
    listen 8001;
    server_name localhost;
    root /var/www/html/laravel/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# Port 8002 - Lumen API
server {
    listen 8002;
    server_name localhost;
    root /var/www/html/lumen/public;
    index index.php;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass php-fpm;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }
}

# Port 8080 - Main gateway (API + routing)
server {
    listen 8080;
    server_name localhost;

    root /var/www/html;
    index index.html index.php;

    # Dashboard
    location = / {
        try_files /index.html =404;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }

    # API - proxy to Laravel
    location /api/ {
        try_files $uri @api_php;
    }
    location @api_php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/laravel/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # PHP App - serves index.php for directory requests
    location /app/ {
        alias /var/www/html/app/public/;
        index index.php;
        try_files $uri $uri/ /app/index.php?$query_string;
    }
    location /app {
        return 301 /app/;
    }

    # PHP processing for PHP App
    location ~ ^/app/(.*\.php)$ {
        alias /var/www/html/app/public/$1;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        include fastcgi_params;
    }

    # Laravel
    location /laravel/ {
        alias /var/www/html/laravel/public/;
        index index.php;
        try_files $uri $uri/ @laravel_php;
    }
    location /laravel {
        return 301 /laravel/;
    }
    location @laravel_php {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/laravel/public/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PATH_TRANSLATED $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # PHP processing for Laravel
    location ~ ^/laravel/(.*\.php)$ {
        alias /var/www/html/laravel/public/$1;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        include fastcgi_params;
    }

    # Lumen
    location /lumen/ {
        alias /var/www/html/lumen/public/;
        try_files $uri @lumen_php;
    }
    location /lumen {
        return 301 /lumen/;
    }
    location @lumen_php {
        rewrite ^/lumen(/.*)$ $1 break;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/lumen/public/index.php;
        include fastcgi_params;
    }

    # Static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|txt|xml|webp)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
