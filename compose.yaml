#
# compose.yaml - Lapong Docker Development Environment
#
# 3 containers: nginx + php-fpm + postgresql (Laravel 12)
#
# Usage:
#   make up      - Start all services
#   make down    - Stop all services
#   make build   - Rebuild images
#   make test    - Run tests
#
services:

    db:
        build:
            context: ./database/
            dockerfile: Dockerfile

        image: postgresql-image
        container_name: lapong-postgresql-container

        # Host network: PostgreSQL listens on 127.0.0.1:5432 (ports: ignored)
        network_mode: host

        env_file:
            - .env

        volumes:
            - ./database/data:/var/lib/postgresql/data

        restart: unless-stopped

    php:
        build:
            context: .
            dockerfile: php/Dockerfile
            args:
                PHP_VERSION: "8.4"

        image: php-fpm-image
        container_name: lapong-php-fpm-container

        network_mode: host

        env_file:
            - .env

        volumes:
            - ./src:/var/www/html
            - ./php/phpunit.xml.dist:/var/www/phpunit.xml.dist:ro
            - ./php/tests:/var/www/tests:ro

        environment:
            - POSTGRES_HOST=127.0.0.1
            - POSTGRES_PORT=5432

        depends_on:
            - db

        restart: unless-stopped

    webserver:
        build:
            context: ./webserver/
            dockerfile: Dockerfile

        image: nginx-image
        container_name: lapong-nginx-container

        # Host network: nginx listens on 127.0.0.1:8080 (ports: ignored)
        network_mode: host

        volumes:
            - ./src:/var/www/html:ro

        depends_on:
            - php

        restart: unless-stopped
