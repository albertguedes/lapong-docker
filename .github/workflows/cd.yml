name: CD

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Version tag (e.g., v0.10.0)
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: "1"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine3.23
        env:
          POSTGRES_DB: lapongdb
          POSTGRES_USER: lapong
          POSTGRES_PASSWORD: lapong
        ports:
          - 5432:5432
        options: >-
          --health-cmd=pg_isready
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
          --health-start-period=30s

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          POSTGRES_DB=lapongdb
          POSTGRES_USER=lapong
          POSTGRES_PASSWORD=lapong
          EOF

      - name: Build PHP image
        run: docker compose build --build-arg PHP_VERSION=8.4 php

      - name: Start Docker Compose stack
        run: docker compose up -d

      - name: Wait for PostgreSQL to be ready
        run: |
          echo "Waiting for PostgreSQL to be ready..."
          for i in {1..30}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U lapong > /dev/null 2>&1; then
              echo "PostgreSQL is ready"
              break
            fi
            echo "Waiting for PostgreSQL... ($i/30)"
            sleep 2
          done

      - name: Run Unit tests
        run: docker compose run --rm php php /usr/local/bin/phpunit --configuration /var/www/phpunit.xml.dist --testsuite=Unit
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: lapongdb
          POSTGRES_USER: lapong
          POSTGRES_PASSWORD: lapong

      - name: Run Integration tests
        run: docker compose run --rm php php /usr/local/bin/phpunit --configuration /var/www/phpunit.xml.dist --testsuite=Integration
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          POSTGRES_DB: lapongdb
          POSTGRES_USER: lapong
          POSTGRES_PASSWORD: lapong

  build:
    name: Build and Push Images
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        arch: [linux/amd64, linux/arm64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Get version
        id: version
        run: |
          VERSION=${GITHUB_REF_NAME:-${{ inputs.version }}}
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build, tag and push db image
        uses: docker/build-push-action@v6
        with:
          context: ./database
          platforms: ${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/db:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository }}/db:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/db:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build, tag and push php image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: php/Dockerfile
          platforms: ${{ matrix.arch }}
          build-args: PHP_VERSION=8.4
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/php:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository }}/php:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/php:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build, tag and push webserver image
        uses: docker/build-push-action@v6
        with:
          context: ./webserver
          platforms: ${{ matrix.arch }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/webserver:${{ steps.version.outputs.version }}-${{ matrix.arch }}
            ghcr.io/${{ github.repository }}/webserver:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}/webserver:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max